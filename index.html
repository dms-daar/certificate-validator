<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Validator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
            margin: 0;
        }
        .container {
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        input {
            padding: 10px;
            width: 250px;
            margin-right: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px 15px;
            border: none;
            background: #007bff;
            color: white;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Certificate Validator</h2>
        <p>Enter your certificate validation code:</p>
        <input type="text" id="validationCode" placeholder="Enter validation code">
        <button onclick="validateCertificate()">Search</button>
    </div>

    <script>
        function validateCertificate() {
            var code = document.getElementById("validationCode").value.trim();
            if (code) {
                window.location.href = "verify/" + encodeURIComponent(code) + ".pdf";
            } else {
                alert("Please enter a validation code.");
            }
        }
    </script>
</body>
</html>
